name: Agent documentation

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      - name: Configure devenv cache
        uses: cachix/cachix-action@3ba601ff5bbb07c7220846facfa2cd81eeee15a1 # v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Verify grounded agent documentation
        run: devenv test

      - name: Check external documentation links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: devenv shell zola check
