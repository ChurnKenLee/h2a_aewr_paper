schema_version = 1

[[groups]]
id = "execution-runtime"
title = "Execution, paths, and validation"
description = "How supported entry points locate the repository, execute mixed R/Python stages, and enforce the fast gate."

[[groups]]
id = "geography-data"
title = "Geography and shared-data contracts"
description = "Canonical identifiers, fail-closed joins, price fallbacks, prediction metadata, and panel keys."

[[groups]]
id = "did"
title = "Difference-in-differences design"
description = "Treatment classification, sample selection, formulas, fixed effects, and clustered inference."

[[groups]]
id = "panel-iv"
title = "Panel-IV design"
description = "Frozen instrument constants, controls, identifiers, weights, sample restrictions, and coefficient extraction."

[[groups]]
id = "mundlak-chamberlain"
title = "Mundlak-Chamberlain specification program"
description = "Calendars, resource/rank budgets, registries, finite-design reference states, and CCV covariance."

