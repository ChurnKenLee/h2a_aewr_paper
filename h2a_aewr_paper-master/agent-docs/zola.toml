base_url = "http://127.0.0.1:1111"
title = "H-2A AEWR Agent Guide"
description = "Grounded, freshness-checked documentation for coding agents working on the H-2A AEWR paper"
compile_sass = true
minify_html = false
build_search_index = true
generate_sitemap = false
generate_robots_txt = false

[markdown]
smart_punctuation = true
github_alerts = true
insert_anchor_links = "right"

[markdown.highlighting]
error_on_missing_language = true
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

[link_checker]
internal_level = "error"
external_level = "error"
skip_anchor_prefixes = [
  "https://github.com/",
]

[search]
include_title = true
include_description = true
include_path = true
include_content = true
index_format = "fuse_json"

[extra]
repository = "ChurnKenLee/h2a_aewr_paper"
