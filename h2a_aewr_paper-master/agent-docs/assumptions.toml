schema_version = 1

[[assumptions]]
id = "AUTH-001"
status = "active"
risk = "critical"
owner = "repository"
statement = "Executable code, runners, locks, and checked contracts outrank prose when sources disagree."
source = "AGENTS.md"
review_when = "Any source-of-truth or documentation workflow changes."
[[assumptions.checks]]
path = "AGENTS.md"
contains = "Executable code, pipeline runners, lockfiles, and machine-checked contracts."

[[assumptions]]
id = "GROUND-001"
status = "active"
risk = "critical"
owner = "agent grounding"
statement = "Authoritative grounding code fences are source-derived, selector-addressed, syntax-checked, and blocked when their reviewed excerpt digest changes."
source = "scripts/agent_grounding.py"
review_when = "Snippet selection, rendering, validation, acceptance, or generated documentation changes."
[[assumptions.checks]]
path = "scripts/agent_grounding.py"
contains = "source-linked excerpt drifted"
[[assumptions.checks]]
path = "scripts/agent_grounding.py"
contains = "accept-snippet-drift"
[[assumptions.checks]]
path = "agent-docs/snippets.toml"
contains = "schema_version = 1"

[[assumptions]]
id = "GROUND-002"
status = "active"
risk = "high"
owner = "agent grounding"
statement = "Literal code fences on agent-grounding surfaces are rejected unless they have a language and an explicit non-authoritative classification."
source = "scripts/agent_grounding.py"
review_when = "Grounding Markdown scope or literal-fence policy changes."
[[assumptions.checks]]
path = "scripts/agent_grounding.py"
contains = "literal grounding fence is unclassified"
[[assumptions.checks]]
path = "scripts/agent_grounding.py"
contains = "grounding fence has no language"

[[assumptions]]
id = "ROOT-001"
status = "active"
risk = "high"
owner = "shared pipeline"
statement = "The .here marker and code/paths.R define repository-root paths for supported R entry points."
source = "code/paths.R"
review_when = "Path discovery or repository layout changes."
[[assumptions.checks]]
path = "code/paths.R"
contains = "project_path <- function(...) here::here(...)"
[[assumptions.checks]]
path = ".here"
contains = ""
allow_empty = true

[[assumptions]]
id = "GEO-001"
status = "active"
risk = "critical"
owner = "shared pipeline"
statement = "Persistent geographic identifiers are strings and county_fips uses the 2010 county vintage."
source = "documentation/geographic_code_contract.md"
review_when = "Any producer, crosswalk, join key, or geographic vintage changes."
[[assumptions.checks]]
path = "documentation/geographic_code_contract.md"
contains = "All fields are strings."
[[assumptions.checks]]
path = "documentation/geographic_code_contract.md"
contains = "The project uses 2010 county geography."

[[assumptions]]
id = "GEO-002"
status = "active"
risk = "critical"
owner = "shared pipeline"
statement = "Oglala Lakota County code 46102 is mapped to 2010-vintage Shannon County code 46113."
source = "documentation/geographic_code_contract.md"
review_when = "County-vintage normalization changes."
[[assumptions.checks]]
path = "documentation/geographic_code_contract.md"
regex = "46102.*46113"

[[assumptions]]
id = "PRED-001"
status = "active"
risk = "critical"
owner = "B01 prediction"
statement = "The selected H-2A prediction trains through 2011 and uses model_spec climate_norm_static_v1."
source = "code/paths.R"
review_when = "Prediction training, scoring, cutoff, or shared-panel join changes."
[[assumptions.checks]]
path = "code/paths.R"
contains = "H2A_PREDICTION_CUTOFF_YEAR <- 2011L"
[[assumptions.checks]]
path = "code/paths.R"
contains = "H2A_PREDICTION_MODEL_SPEC <- \"climate_norm_static_v1\""

[[assumptions]]
id = "PANEL-001"
status = "active"
risk = "critical"
owner = "C02 shared panel"
statement = "The shared county-year panel contains reusable measures but no design treatment, post indicator, fixed-effect encoding, target cluster, or instrument."
source = "code/c02_build/README.md"
review_when = "The shared-panel schema or any design input changes."
[[assumptions.checks]]
path = "code/c02_build/README.md"
regex = "It\\s+does\\s+not create any design treatment"

[[assumptions]]
id = "DID-001"
status = "active"
risk = "critical"
owner = "DiD design"
statement = "The baseline DiD post period begins after 2011."
source = "code/designs/did/01_build_did_panel.R"
review_when = "Treatment timing or the panel calendar changes."
[[assumptions.checks]]
path = "code/designs/did/01_build_did_panel.R"
contains = "mutate(post = year > 2011L)"

[[assumptions]]
id = "DID-002"
status = "active"
risk = "critical"
owner = "DiD design"
statement = "DiD models use county and year fixed effects and cluster by commuting-zone × AEWR-region interaction."
source = "code/designs/did/helpers.R"
review_when = "Formula or inference code changes."
[[assumptions.checks]]
path = "code/designs/did/helpers.R"
contains = "did_cluster_formula <- ~ cz_id^aewr_region_id"
[[assumptions.checks]]
path = "code/designs/did/helpers.R"
contains = "| county_fips + year"

[[assumptions]]
id = "PIV-001"
status = "active"
risk = "critical"
owner = "panel-IV design"
statement = "The panel-IV policy window is 2011-2022, with five subregions and two primary donor subregions."
source = "code/designs/panel_iv/design.R"
review_when = "Clustering, donor selection, or the policy calendar changes."
[[assumptions.checks]]
path = "code/designs/panel_iv/design.R"
contains = "DISSIMILARITY_IV_PRIMARY_K <- 5L"
[[assumptions.checks]]
path = "code/designs/panel_iv/design.R"
contains = "DISSIMILARITY_IV_PRIMARY_DONOR_COUNT <- 2L"
[[assumptions.checks]]
path = "code/designs/panel_iv/design.R"
contains = "DISSIMILARITY_IV_POLICY_START_YEAR <- 2011L"
[[assumptions.checks]]
path = "code/designs/panel_iv/design.R"
contains = "DISSIMILARITY_IV_POLICY_END_YEAR <- 2022L"

[[assumptions]]
id = "PIV-002"
status = "active"
risk = "critical"
owner = "panel-IV design"
statement = "The preferred instrument adds quarterly worker-share moments to the wage target and uses soft entropy rho=0.10."
source = "code/designs/panel_iv/design.R"
review_when = "Moment construction, calibration, or preferred-specification labels change."
[[assumptions.checks]]
path = "code/designs/panel_iv/design.R"
contains = "fls_field_livestock_wage_plus_quarterly_worker_shares"
[[assumptions.checks]]
path = "code/designs/panel_iv/design.R"
contains = "DISSIMILARITY_IV_PRIMARY_RHO <- 0.10"

[[assumptions]]
id = "PIV-003"
status = "active"
risk = "high"
owner = "panel-IV design"
statement = "The static H-2A propensity differential trend is a control, not an excluded instrument."
source = "code/designs/panel_iv/design.R"
review_when = "Controls, first-stage formulas, or prediction use changes."
[[assumptions.checks]]
path = "code/designs/panel_iv/design.R"
contains = "DISSIMILARITY_IV_PROPENSITY_TREND_TERM"
[[assumptions.checks]]
path = "code/designs/panel_iv/README.md"
contains = "never an excluded instrument"

[[assumptions]]
id = "MC-001"
status = "active"
risk = "critical"
owner = "Mundlak-Chamberlain design"
statement = "The supported design version is 3.0.0 with 2008-2010 baselines, 2011-2022 treatment history, and 2013-2022 analysis years."
source = "code/designs/mundlak_chamberlain/design.R"
review_when = "Calendar, lags, design version, or registry construction changes."
[[assumptions.checks]]
path = "code/designs/mundlak_chamberlain/design.R"
contains = "MC_BASELINE_YEARS <- 2008:2010"
[[assumptions.checks]]
path = "code/designs/mundlak_chamberlain/design.R"
contains = "MC_TREATMENT_HISTORY_YEARS <- 2011:2022"
[[assumptions.checks]]
path = "code/designs/mundlak_chamberlain/design.R"
contains = "MC_ANALYSIS_YEARS <- 2013:2022"
[[assumptions.checks]]
path = "code/designs/mundlak_chamberlain/design.R"
contains = "MC_SPEC_PROGRAM_VERSION <- \"3.0.0\""

[[assumptions]]
id = "MC-002"
status = "active"
risk = "critical"
owner = "Mundlak-Chamberlain design"
statement = "Finite-design CCV uses 17 balanced cyclic AEWR-path assignments and therefore 16 reference degrees of freedom."
source = "code/designs/mundlak_chamberlain/design.R"
review_when = "Reference law, assignment units, covariance, or critical values change."
[[assumptions.checks]]
path = "code/designs/mundlak_chamberlain/design.R"
contains = "MC_CCV_REFERENCE_STATES <- 17L"
[[assumptions.checks]]
path = "code/designs/mundlak_chamberlain/design.R"
contains = "MC_CCV_DF <- MC_CCV_REFERENCE_STATES - 1L"
[[assumptions.checks]]
path = "code/designs/mundlak_chamberlain/design.R"
contains = "balanced_cyclic_aewr_path_assignment"

[[assumptions]]
id = "MC-003"
status = "active"
risk = "high"
owner = "Mundlak-Chamberlain design"
statement = "The default version-3 queue is compact and resource-guarded; exhaustive registry execution is opt-in."
source = "code/designs/mundlak_chamberlain/design.R"
review_when = "Execution stages, resource guards, or registry size changes."
[[assumptions.checks]]
path = "code/designs/mundlak_chamberlain/design.R"
contains = "MC_SPEC_DEFAULT_STAGE <- \"compact\""
[[assumptions.checks]]
path = "code/designs/mundlak_chamberlain/README.md"
contains = "MC_SPEC_STAGE=exhaustive"

[[assumptions]]
id = "DOC-001"
status = "historical"
risk = "critical"
owner = "documentation"
statement = "The 2023 H2A Estimation Strategy Word file proposes a border-enforcement shift-share design and is not a current supported runner."
source = "documentation/H2A Estimation Strategy.docx"
review_when = "A border-enforcement design becomes executable or the file is reclassified."
[[assumptions.checks]]
path = "documentation/H2A Estimation Strategy.docx"
exists = true
[[assumptions.checks]]
path = "scripts/run_all.sh"
not_contains = "border"

[[assumptions]]
id = "DOC-002"
status = "historical"
risk = "critical"
owner = "documentation"
statement = "The 2024 Price Index Construction Word file proposes Nielsen/FAF gravity recovery; the supported derived pipeline uses the NASS/CDL Fisher implementation."
source = "documentation/Price Index Construction.docx"
review_when = "The supported price-index producer changes."
[[assumptions.checks]]
path = "documentation/Price Index Construction.docx"
exists = true
[[assumptions.checks]]
path = "scripts/run_derived.sh"
contains = "02_price_index_nass_synthetic_cdl.py"

[[assumptions]]
id = "DATA-001"
status = "active"
risk = "high"
owner = "repository"
statement = "Raw and processed data are ignored local state; repository static checks do not prove empirical reproducibility."
source = ".gitignore"
review_when = "Data distribution or fixture policy changes."
[[assumptions.checks]]
path = ".gitignore"
contains = "data/"
