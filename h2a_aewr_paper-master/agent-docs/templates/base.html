<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
    <link rel="stylesheet" href="{{ get_url(path='site.css') }}">
    <link rel="stylesheet" href="{{ get_url(path='giallo-light.css') }}" media="(prefers-color-scheme: light)">
    <link rel="stylesheet" href="{{ get_url(path='giallo-dark.css') }}" media="(prefers-color-scheme: dark)">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ get_url(path='@/_index.md') }}">{{ config.title }}</a>
      <nav aria-label="Primary">
        <a href="{{ get_url(path='@/operating-protocol.md') }}">Protocol</a>
        <a href="{{ get_url(path='@/architecture/_index.md') }}">Architecture</a>
        <a href="{{ get_url(path='@/contracts/_index.md') }}">Contracts</a>
        <a href="{{ get_url(path='@/designs/_index.md') }}">Designs</a>
        <a href="{{ get_url(path='@/generated/_index.md') }}">Generated</a>
      </nav>
    </header>
    <div class="shell">
      <main>{% block content %}{% endblock content %}</main>
    </div>
    <footer>
      <p>Source-first agent documentation. Verify with <code>python scripts/agent_grounding.py verify</code>.</p>
    </footer>
  </body>
</html>
