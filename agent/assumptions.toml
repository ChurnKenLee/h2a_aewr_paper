schema_version = 1

[[assumptions]]
id = "ACCESS-001"
risk = "critical"
owner = "repository data access"
statement = "Non-public NASS data and custom tabulations are unavailable by user instruction. Use publicly released NASS data; the implemented county-level work requires no farm-level nonparticipant frame or institutional-access application."
source = "AGENTS.md"
review_when = "A data plan introduces restricted NASS access/tabulations, a farm-participation estimand, or a new population denominator."
scopes = ["AGENTS.md", "code", "src/h2a", "scripts", "content"]
[[assumptions.checks]]
path = "AGENTS.md"
contains = "Non-public NASS data and custom tabulations are unavailable"
[[assumptions.checks]]
path = "code/designs/border_discontinuity/data_input_validation.py"
contains = '"nonpublic_nass_required": False'

[[assumptions]]
id = "AUTH-001"
risk = "critical"
owner = "repository"
statement = "Executable code, runners, locks, and machine checks outrank prose when sources disagree."
source = "AGENTS.md"
review_when = "The source-of-truth or documentation workflow changes."
scopes = ["AGENTS.md", "content", "documentation", "draft", "outputs"]
[[assumptions.checks]]
path = "AGENTS.md"
contains = "When sources disagree, use this authority order"

[[assumptions]]
id = "GROUND-001"
risk = "critical"
owner = "agent documentation"
statement = "A source-region digest can be accepted only after the linked documentation context changes."
source = "scripts/agent_docs.py"
review_when = "Grounding extraction, verification, generation, or drift acceptance changes."
scopes = ["AGENTS.md", "content", "scripts/agent_docs.py", "templates", "static"]
[[assumptions.checks]]
path = "scripts/agent_docs.py"
contains = "Documentation prose changed since review"
[[assumptions.checks]]
path = "content/AGENTS.md"
contains = "Never accept source drift by changing only a digest."

