[[assumptions]]
id = "REFORM-001"
risk = "critical"
owner = "historical wage-reform investigation"
statement = "Historical wage-reform outputs are diagnostics, not a promoted causal elasticity. Cohort type and geography are fixed at baseline; absent certification is zero participation while wages stay missing. Observed 2009 application wages never assign statutory exposure, and old herder contracts are not grandfathered out of the wage increase."
