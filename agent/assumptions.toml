review_when = "A wage schedule, cohort, occupation/skill assignment, timing convention, legal coverage, outcome, identity map, inference rule or causal-promotion decision changes."
scopes = ["code/designs/wage_reforms", "scripts/run_wage_reforms.sh", "content/designs/wage-reforms.md"]
[[assumptions.checks]]
path = "code/designs/wage_reforms/design.json"
contains = 'Diagnostic response and support investigation; no causal elasticity is authorized by this registry.'
[[assumptions.checks]]
path = "code/designs/wage_reforms/design.json"
contains = 'Future disappearance is retained as zero certified participation.'
[[assumptions.checks]]
path = "code/designs/wage_reforms/policy_sources.json"
