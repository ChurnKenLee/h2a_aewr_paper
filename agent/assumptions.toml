[[assumptions]]
id = "IV-001"
risk = "critical"
owner = "panel IV"
statement = "Panel IV retains the original moving-wage four-column design with deterministic county entropy weights and source year t-1. All branch stages and tests are R. The fixed-wage revision, later exploratory exercises, and simulated calibration draws were retired by explicit user instruction. estimation_spec.json is the sole model/outcome registry; controlled seasonal/composition column4 remains preferred. Preserve original donor support, prior behavior, twelve outcomes, reviewed business linkage, controls, equal weights, county/year FE and target-subregion CRV1. The farm-floor selection explicitly records the original all-domain Census source rows and refuses source-fingerprint drift; revising those choices is an empirical change. Recovered weights are not observed sampling errors; current FLS wage targets may induce mechanical relevance. The runner validates at stage09 and ends with the user-reauthorized stage10--11 Kitagawa decomposition diagnostic, which uses recovered weights as-is, fixes donor wages at their 2008--2010 real mean on a balanced donor set, and never replaces an instrument or selects a model."
source = "content/designs/panel-iv.md"
review_when = "Donor support, frame fills or farm floor, calibration moments/solver/guards, deterministic schema, controls, samples, preferred column, outcome/linkage registry, inference or implementation language changes."
scopes = ["code/designs/panel_iv", "scripts/run_panel_iv.sh", "content/designs/panel-iv.md"]
[[assumptions.checks]]
path = "scripts/run_panel_iv.sh"
contains = 'run_step code/designs/panel_iv/03_build_fls_frame.R'
[[assumptions.checks]]
path = "scripts/run_panel_iv.sh"
contains = 'run_step code/designs/panel_iv/04_recover_fls_geography.R'
[[assumptions.checks]]
path = "scripts/run_panel_iv.sh"
contains = 'run_step code/designs/panel_iv/09_validate_artifacts.R'
[[assumptions.checks]]
path = "scripts/run_panel_iv.sh"
contains = 'run_step code/designs/panel_iv/11_estimate_instrument_decomposition.R'
[[assumptions.checks]]
path = "code/designs/panel_iv/decomposition.R"
contains = 'IV_DECOMPOSITION_BASE_WAGE_YEARS <- 2008:2010'
[[assumptions.checks]]
path = "code/designs/panel_iv/calibration.R"
contains = 'IV_MAX_ITERATIONS <- 100L'
[[assumptions.checks]]
path = "code/designs/panel_iv/calibration.R"
contains = 'IV_RHO <- 0.10'
[[assumptions.checks]]
path = "code/designs/panel_iv/io.R"
contains = 'panel_iv_deterministic_v1'
