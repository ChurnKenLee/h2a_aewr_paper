[[assumptions]]
id = "IV-001"
risk = "critical"
owner = "panel IV"
statement = "Panel IV retains the original moving-wage design with deterministic county entropy weights and source year t-1. All branch stages and tests are R. The fixed-wage revision, later exploratory exercises, simulated calibration draws, the wage-only instrument and the continuing control set were retired by explicit user instruction. estimation_spec.json is the sole model/outcome registry: two columns on the wage-plus-seasonal/composition instrument, without controls (column1) and with the committed BEA controls (column2, preferred). Estimation policy years are 2011--2023 because CAEMP25N ends in 2022; the instrument and the branch panel are still constructed through 2024. Stage04 recovers only the wage-plus-seasonal/composition distribution; the wage-only calibration and its z_wage_only_real field were retired with the wage-only columns. Preserve original donor support, prior behavior, twelve outcomes, reviewed business linkage, controls, equal weights, county/year FE and target-subregion CRV1. The farm-floor selection explicitly records the original all-domain Census source rows and refuses source-fingerprint drift; revising those choices is an empirical change. Recovered weights are not observed sampling errors; current FLS wage targets may induce mechanical relevance. The runner validates at stage09 and ends with the user-requested stage10 Kitagawa decomposition diagnostic, which uses recovered weights as-is, fixes donor wages at their 2008--2010 real mean on a balanced donor set, reports component variance shares only, and never replaces the instrument or selects a model, and with the user-requested stage11 QWI wage-granularity diagnostic, which multiplies the OEWS wage by an annual county QWI NAICS 111/112 factor in memory and recalibrates the weights on it, writes no calibration or instrument artifact, estimates no outcome equation and never selects a wage source; the OEWS proxy remains the only wage of the calibration and the instrument."
source = "content/designs/panel-iv.md"
review_when = "Donor support, frame fills or farm floor, calibration moments/solver/guards, deterministic schema, controls, samples, preferred column, outcome/linkage registry, inference or implementation language changes."
scopes = ["code/designs/panel_iv", "scripts/run_panel_iv.sh", "content/designs/panel-iv.md"]
