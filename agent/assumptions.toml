path = "code/welfare/01_narrow_welfare.py"
contains = 'ELASTICITY_DEFINITION = "dlog_certified_hours_dlog_real_aewr"'
[[assumptions.checks]]
path = "code/welfare/01_narrow_welfare.py"
contains = 'APPLICATION_POPULATION = "all_shared_panel_county_years"'
[[assumptions.checks]]
