base_url = "http://127.0.0.1:1111"
title = "H-2A Paper Documentation"
description = "Technical documentation for the H-2A empirical pipeline"
build_search_index = true
ignored_content = ["**/AGENTS.md"]

[markdown]
smart_punctuation = true
github_alerts = true
insert_anchor_links = "right"

[markdown.highlighting]
error_on_missing_language = true
style = "class"
light_theme = "github-light"
dark_theme = "github-dark"

[link_checker]
internal_level = "error"
external_level = "error"
skip_anchor_prefixes = [
  "https://github.com/",
]

[search]
include_title = true
include_description = true
include_path = true
include_content = true
index_format = "fuse_json"

[extra]
repository_url = "https://github.com/ChurnKenLee/h2a_aewr_paper"
repository_ref = "master"
