<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ config.description }}">
    <title>{% block title %}{{ config.title }}{% endblock title %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.css" integrity="sha384-u1zONI5gPXUx0UKI62c75/zww972y0v2rSK5ZYlVdS6xEuWDeZWUI66v6t1gvlXJ" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ get_url(path='styles.css') }}">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/katex.min.js" integrity="sha384-ykMNcWQhhTUb0YV9SPpPUFURHZ+tWmubkakGBP+OgNK/UXdO2gtzglWx0Rj9hnO3" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.18.4/dist/contrib/auto-render.min.js" integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz" crossorigin="anonymous"></script>
    <script defer src="{{ get_url(path='math.js') }}"></script>
    <link rel="alternate" type="text/plain" title="LLM documentation index" href="{{ get_url(path='llms.txt') }}">
    <link rel="alternate" type="application/json" title="Grounded agent context" href="{{ get_url(path='grounding-manifest.json') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="site-title" href="/">{{ config.title }}</a>
      <nav aria-label="Documentation sections">
        <a href="{{ get_url(path='@/architecture/_index.md') }}">Architecture</a>
        <a href="{{ get_url(path='@/contracts/_index.md') }}">Contracts</a>
        <a href="{{ get_url(path='@/designs/_index.md') }}">Designs</a>
        <a href="{{ get_url(path='@/reference/_index.md') }}">Agent reference</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock content %}
    </main>
  </body>
</html>
